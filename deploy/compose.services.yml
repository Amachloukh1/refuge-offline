# Services facultatifs : réutiliser les projets existants au lieu de les réécrire.
# À préparer en ligne puis conserver les images avec docker image save.
# Les volumes modèles/contenus sont indispensables, l'image Docker seule ne suffit pas.
services:
  ollama:
    image: ollama/ollama:latest
    profiles: [local-ai]
    ports: [127.0.0.1:11479:11434]
    volumes: [ollama:/root/.ollama]
    environment: [OLLAMA_NO_CLOUD=1, OLLAMA_CONTEXT_LENGTH=4096, OLLAMA_MAX_LOADED_MODELS=1, OLLAMA_NUM_PARALLEL=1]
    restart: unless-stopped
  kiwix:
    image: ghcr.io/kiwix/kiwix-serve:latest
    profiles: [library]
    ports: [127.0.0.1:8008:8080]
    volumes: [../content/zim:/data:ro]
    command: ['*.zim']
    restart: unless-stopped
  grocy:
    image: lscr.io/linuxserver/grocy:latest
    profiles: [grocy]
    ports: [127.0.0.1:9283:80]
    volumes: [grocy:/config]
    environment: [PUID=1000, PGID=1000, TZ=Europe/Berlin]
    restart: unless-stopped
volumes:
  ollama:
  grocy:
